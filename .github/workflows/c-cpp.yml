name: C/C++ CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential autoconf automake libtool pkg-config

      - name: Configure
        run: |
          if [ -f configure ]; then
            chmod +x configure
            ./configure
          else
            autoreconf -fi
            ./configure
          fi

      - name: Build
        run: make -j"$(nproc)"

      - name: Test
        run: make check -j"$(nproc)"

      - name: Distcheck
        run: make distcheck -j"$(nproc)"
